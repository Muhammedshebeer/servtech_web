# Include this file inside the HTTPS server block for servtech.ae.
# These are exact legacy-to-current mappings; there is intentionally no catch-all redirect.

# Normalize the duplicate home document.
location = /index.html { return 301 https://servtech.ae/; }

# Legacy service URLs retained by search engines and external links.
location ~ ^/valvesdivision(?:\.html)?/?$ { return 301 https://servtech.ae/service-valves.html; }
location ~ ^/boilermaintenance(?:\.html)?/?$ { return 301 https://servtech.ae/service-boiler.html; }
location ~ ^/turbinemaintenance(?:\.html)?/?$ { return 301 https://servtech.ae/service-turbine.html; }
location ~ ^/industrialfabricationanderection(?:\.html)?/?$ { return 301 https://servtech.ae/service-fabrication.html; }
location ~ ^/machiningandreverseengineering(?:\.html)?/?$ { return 301 https://servtech.ae/service-machining.html; }
location ~ ^/technicalmanpowerservices(?:\.html)?/?$ { return 301 https://servtech.ae/service-manpower.html; }
location ~ ^/fabrication/?$ { return 301 https://servtech.ae/service-fabrication.html; }
location ~ ^/service-piping(?:\.html)?/?$ { return 301 https://servtech.ae/service-fabrication.html; }

# Legacy conversion and catalog URLs.
location ~ ^/quick-quote(?:\.html)?/?$ { return 301 https://servtech.ae/quote.html; }
location ~ ^/products-authorized-brands(?:\.html)?/?$ { return 301 https://servtech.ae/products.html; }

# Keep the downloaded legacy-site archive out of the public web root if the full
# source folder is deployed. It is reference material, not a replacement website.
location ^~ /www.servtech.ae/ { return 404; }
